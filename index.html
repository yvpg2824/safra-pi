<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAFRA.PI | Pi Gaming</title>

    <meta
        name="description"
        content="SAFRA.PI — uma experiência de jogo inspirada no ecossistema Pi."
    >

    <link rel="stylesheet" href="style.css">

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <img
            src="Safra_pi_S_logo_1024x1024_transparente.png"
            alt="Logo SAFRA.PI"
            class="brand-logo"
        >
        <span>SAFRA.PI</span>
    </div>

    <div class="project-message">
        <strong data-i18n="projectMessage">
            Faça parte da nova experiência da Pi Network.
        </strong>

        <span data-i18n="projectSubmessage">
            Um novo projeto está começando. Explore e acompanhe essa evolução.
        </span>
    </div>

    <nav class="top-actions">

        <select id="language" aria-label="Idioma">
            <option value="pt">🇧🇷 Português</option>
            <option value="en">🇺🇸 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="de">🇩🇪 Deutsch</option>
        </select>

        <button
            id="depositButton"
            class="deposit-button"
            data-i18n="depositButton"
        >
            Depositar Pi
        </button>

        <button
            id="piLoginButton"
            class="deposit-button"
            type="button"
        >
            Entrar com Pi
        </button>

    </nav>

</header>

<main class="container">

    <div class="test-notice" data-i18n="testNotice">
        ⚠ VERSÃO DE TESTE — O site está em desenvolvimento e pode sofrer alterações.
